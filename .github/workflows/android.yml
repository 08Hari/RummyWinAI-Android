name: RummyWinAI Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o RummyWinAI_Android_Starter.zip -d source

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/RummyWinAI_Android/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "    compileSdk = 35",
              """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }"""
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: source/RummyWinAI_Android
          arguments: assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RummyWinAI-debug-APK
          path: source/RummyWinAI_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
